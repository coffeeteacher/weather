<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // 驗證是否連上unsplash api        
        // https://api.unsplash.com/search/photos/?client_id=自己的accessKey
        // https://api.unsplash.com/photos/?client_id=YOUR_ACCESS_KEY


        const api = 'https://api.unsplash.com/search/photos';
        const accessKey = 'LbtOYu_nN2Y4nAE2vNvWKb7nbyTCRjmOTB_cyQnqz7M';
        const filterString='dog';

        // 將getPhotos獨立出來
        // 建立非同步方法，取得遠端資料    
        const getPhotos = async () => {            
            // console.log(`${api}?client_id=${accessKey}&query=${filterString}`);
            // 發出請求給遠端api，傳回結果
            const result = await axios.get(`${api}?client_id=${accessKey}&query=${filterString}&page=10`);
            // 全部資料
            console.log(result);
            // 顯示10筆記錄
            console.log(result.data.results);
        }
        getPhotos();
        
    </script>

</body>

</html>
